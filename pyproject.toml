[project]
name = "knowledge-base"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "dashscope>=1.26.4",
    "fastapi>=0.139.0",
    "flagembedding>=1.4.0",
    "httpx>=0.28.1",
    "langchain>=1.3.11",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.3.3",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.8",
    "loguru>=0.7.3",
    "mcp>=1.28.1",
    "mcp-client>=0.0.0",
    "minio>=7.2.20",
    "mistune>=3.3.3",
    "modelscope>=1.38.1",
    "numpy>=2.5.1",
    "pymilvus[model]>=3.0.0",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "requests>=2.31.0",
    "torch>=2.9.0",
    "transformers>=4.45.0,<5.0.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
